---
- ansible.builtin.include_tasks: releases.yaml
  when: >-
    ansible_facts["os_family"] == "RedHat" and (
    (ansible_facts["distribution"] == "CentOS" and ansible_facts["distribution_major_version"]|int > 8) or
    (ansible_facts["distribution"] == "Rocky" and ansible_facts["distribution_major_version"]|int > 8)
    )
